[project]
name = "mokalemeban-sales-api"
version = "0.1.0"
description = "Multi-tenant sales call intelligence API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "asyncpg>=0.29",
  "boto3>=1.34",
  "celery[redis]>=5.4",
  "cryptography>=43",
  "fastapi>=0.115",
  "httpx>=0.27",
  "openai>=1.75",
  "pgvector>=0.3",
  "pydantic-settings>=2.6",
  "PyJWT[crypto]>=2.9",
  "python-multipart>=0.0.12",
  "sqlalchemy[asyncio]>=2.0",
  "structlog>=24.4",
  "uvicorn[standard]>=0.32"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
