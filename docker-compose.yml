x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-environment: &backend-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+asyncpg://mokalemeban:${POSTGRES_PASSWORD:-change-me}@postgres:5432/mokalemeban
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mokalemeban}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-now}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-gpt-4o-transcribe-diarize}
  ANALYSIS_MODEL: ${ANALYSIS_MODEL:-gpt-4o}
  AUTH_DISABLED: ${AUTH_DISABLED:-false}
  OIDC_ISSUER: http://localhost:8081/realms/mokalemeban
  OIDC_JWKS_URL: http://keycloak:8080/realms/mokalemeban/protocol/openid-connect/certs
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
  KEYCLOAK_ADMIN_URL: http://keycloak:8080
  KEYCLOAK_REALM: mokalemeban
  KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN:-admin}
  KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-now}
  FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
  FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}
  FIRST_ADMIN_NAME: ${FIRST_ADMIN_NAME:-}
  DEFAULT_TENANT_NAME: ${DEFAULT_TENANT_NAME:-شرکت پایلوت}
  DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-00000000-0000-4000-8000-000000000001}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  ISSABEL_IMPORT_MODE: ${ISSABEL_IMPORT_MODE:-shared_folder}
  ISSABEL_RECORDINGS_PATH: ${ISSABEL_RECORDINGS_PATH:-/recordings}
  ISSABEL_SFTP_HOST: ${ISSABEL_SFTP_HOST:-}
  ISSABEL_SFTP_PORT: ${ISSABEL_SFTP_PORT:-22}
  ISSABEL_SFTP_USERNAME: ${ISSABEL_SFTP_USERNAME:-}
  ISSABEL_SFTP_PASSWORD: ${ISSABEL_SFTP_PASSWORD:-}
  ISSABEL_SFTP_PASSWORD_FILE: ${ISSABEL_SFTP_PASSWORD_FILE:-}
  ISSABEL_SFTP_PRIVATE_KEY: ${ISSABEL_SFTP_PRIVATE_KEY:-}
  ISSABEL_SFTP_KNOWN_HOSTS: ${ISSABEL_SFTP_KNOWN_HOSTS:-/run/secrets/issabel_known_hosts}
  ISSABEL_SFTP_ALLOW_INSECURE_HOST_KEY: ${ISSABEL_SFTP_ALLOW_INSECURE_HOST_KEY:-false}
  ISSABEL_SFTP_REMOTE_PATH: ${ISSABEL_SFTP_REMOTE_PATH:-/var/spool/asterisk/monitor}
  ISSABEL_SFTP_STAGING_PATH: ${ISSABEL_SFTP_STAGING_PATH:-/sftp-staging}
  ISSABEL_SFTP_MAX_FILES_PER_SCAN: ${ISSABEL_SFTP_MAX_FILES_PER_SCAN:-5000}
  ISSABEL_SFTP_MAX_DEPTH: ${ISSABEL_SFTP_MAX_DEPTH:-8}
  ISSABEL_POLL_INTERVAL: ${ISSABEL_POLL_INTERVAL:-10}
  ISSABEL_FILE_STABILITY_SECONDS: ${ISSABEL_FILE_STABILITY_SECONDS:-15}
  ISSABEL_ALLOWED_EXTENSIONS: ${ISSABEL_ALLOWED_EXTENSIONS:-.wav,.mp3,.gsm}
  ISSABEL_QUARANTINE_PATH: ${ISSABEL_QUARANTINE_PATH:-/quarantine}
  ISSABEL_FILENAME_PATTERN: ${ISSABEL_FILENAME_PATTERN:-}
  ISSABEL_DEFAULT_TENANT_ID: ${ISSABEL_DEFAULT_TENANT_ID:-00000000-0000-4000-8000-000000000001}
  ISSABEL_TEMPORARY_EXTENSIONS: ${ISSABEL_TEMPORARY_EXTENSIONS:-.tmp,.part,.partial,.download}
  ISSABEL_CDR_DATABASE_URL: ${ISSABEL_CDR_DATABASE_URL:-}
  ISSABEL_CDR_HOST: ${ISSABEL_CDR_HOST:-}
  ISSABEL_CDR_PORT: ${ISSABEL_CDR_PORT:-3306}
  ISSABEL_CDR_USERNAME: ${ISSABEL_CDR_USERNAME:-}
  ISSABEL_CDR_PASSWORD: ${ISSABEL_CDR_PASSWORD:-}
  ISSABEL_CDR_PASSWORD_FILE: ${ISSABEL_CDR_PASSWORD_FILE:-}
  ISSABEL_CDR_DATABASE: ${ISSABEL_CDR_DATABASE:-asteriskcdrdb}
  ISSABEL_CDR_TABLE: ${ISSABEL_CDR_TABLE:-cdr}
  ISSABEL_CDR_RECORDING_COLUMN: ${ISSABEL_CDR_RECORDING_COLUMN:-recordingfile}
  ISSABEL_CDR_MATCH_WINDOW_SECONDS: ${ISSABEL_CDR_MATCH_WINDOW_SECONDS:-180}
  AUDIO_MIN_DURATION_SECONDS: ${AUDIO_MIN_DURATION_SECONDS:-2}
  AUDIO_TARGET_SAMPLE_RATE: ${AUDIO_TARGET_SAMPLE_RATE:-16000}
  AUDIO_FFMPEG_PATH: ${AUDIO_FFMPEG_PATH:-ffmpeg}
  AUDIO_FFPROBE_PATH: ${AUDIO_FFPROBE_PATH:-ffprobe}
  PROCESSING_MAX_RETRIES: ${PROCESSING_MAX_RETRIES:-5}
  PROCESSING_RETRY_SCHEDULE_SECONDS: ${PROCESSING_RETRY_SCHEDULE_SECONDS:-30,120,600,1800,7200}
  PROCESSING_STAGE_TIMEOUT_SECONDS: ${PROCESSING_STAGE_TIMEOUT_SECONDS:-1800}
  WATCHER_STALE_AFTER_SECONDS: ${WATCHER_STALE_AFTER_SECONDS:-120}
  WORKER_STALE_AFTER_SECONDS: ${WORKER_STALE_AFTER_SECONDS:-300}

name: mokalemeban

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mokalemeban
      POSTGRES_USER: mokalemeban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mokalemeban -d mokalemeban"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-mokalemeban}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-now}
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me-keycloak}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-now}
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me-keycloak}
    depends_on:
      keycloak-postgres: { condition: service_healthy }
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    restart: unless-stopped
    logging: *default-logging

  api:
    build: ./backend
    environment: *backend-environment
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports:
      - "8000:8000"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=INFO --concurrency=2
    environment: *backend-environment
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$${HOSTNAME} --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  scheduler:
    build: ./backend
    command: celery -A app.tasks.celery_app beat --loglevel=INFO
    environment: *backend-environment
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }
    restart: unless-stopped
    logging: *default-logging

  watcher:
    build: ./backend
    command: python -m app.watcher
    environment: *backend-environment
    volumes:
      - type: bind
        source: ${ISSABEL_HOST_RECORDINGS_PATH:-./sample-recordings}
        target: /recordings
      - quarantine-data:/quarantine
      - sftp-staging-data:/sftp-staging
      - type: bind
        source: ${ISSABEL_SFTP_KNOWN_HOSTS_HOST_PATH:-./deploy/issabel/known_hosts.example}
        target: /run/secrets/issabel_known_hosts
        read_only: true
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports:
      - "8010:8010"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build: ./web
    environment:
      API_BASE_URL: http://api:8000
      OIDC_ISSUER: http://localhost:8081/realms/mokalemeban
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/mokalemeban
      OIDC_CLIENT_ID: mokalemeban-web
      APP_URL: http://localhost:3000
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
  keycloak-postgres-data:
  redis-data:
  minio-data:
  quarantine-data:
  sftp-staging-data:
