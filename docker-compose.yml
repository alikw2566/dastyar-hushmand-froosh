name: mokalemeban

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mokalemeban
      POSTGRES_USER: mokalemeban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mokalemeban -d mokalemeban"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-mokalemeban}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-now}
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-now}
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://mokalemeban:${POSTGRES_PASSWORD:-change-me}@postgres:5432/mokalemeban
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mokalemeban}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-now}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.avalai.ir/v1}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      OIDC_ISSUER: http://localhost:8081/realms/mokalemeban
      OIDC_JWKS_URL: http://keycloak:8080/realms/mokalemeban/protocol/openid-connect/certs
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_REALM: mokalemeban
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-now}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=INFO --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://mokalemeban:${POSTGRES_PASSWORD:-change-me}@postgres:5432/mokalemeban
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mokalemeban}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-now}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.avalai.ir/v1}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      OIDC_ISSUER: http://localhost:8081/realms/mokalemeban
      OIDC_JWKS_URL: http://keycloak:8080/realms/mokalemeban/protocol/openid-connect/certs
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }

  web:
    build: ./web
    environment:
      API_BASE_URL: http://api:8000
      OIDC_ISSUER: http://localhost:8081/realms/mokalemeban
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/mokalemeban
      OIDC_CLIENT_ID: mokalemeban-web
      APP_URL: http://localhost:3000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
  minio-data:
