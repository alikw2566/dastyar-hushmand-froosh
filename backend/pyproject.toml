[project]
name = "mokalemeban-sales-api"
version = "0.1.0"
description = "Multi-tenant sales call intelligence API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "asyncpg>=0.29",
  "asyncssh>=2.20",
  "asyncmy>=0.2.9",
  "boto3>=1.34",
  "celery[redis]>=5.4",
  "cryptography>=43",
  "fastapi>=0.115",
  "httpx>=0.27",
  "openai>=1.75",
  "openpyxl>=3.1",
  "pgvector>=0.3",
  "pydantic-settings>=2.6",
  "PyJWT[crypto]>=2.9",
  "python-multipart>=0.0.12",
  "pyannote.audio>=3.1,<4.0",
  "reportlab>=4.2",
  "arabic-reshaper>=3.0",
  "python-bidi>=0.6",
  "sqlalchemy[asyncio]>=2.0",
  "structlog>=24.4",
  "uvicorn[standard]>=0.32"
]

[project.optional-dependencies]
dev = ["aiosqlite>=0.20", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
mokalemeban-watcher = "app.watcher:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "sql*", "alembic*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
